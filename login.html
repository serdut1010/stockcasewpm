<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4c1d95">
    <title>Login Admin - Wallpaper Malang id</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #4c1d95 0%, #1e1b4b 100%);
        }

        .login-frame {
            display: flex;
        }

        .login-card {
            max-width: 440px;
            padding: 40px;
        }

        .login-mark {
            color: #8b5cf6;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .brand-logo h1 {
            color: #4c1d95;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: lowercase;
        }

        .form-group input {
            min-height: 46px;
        }

        .form-group input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        .login-footer small {
            font-size: 0.75rem;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>
<body>
    <main class="login-frame active">
        <section class="login-card shadow-lg" aria-labelledby="login-title">
            <header class="login-header">
                <p class="login-mark">Admin inventory portal</p>
                <div class="brand-logo">
                    <h1 id="login-title">wallpaper malang</h1>
                    <span class="brand-badge" aria-label="Indonesia">id</span>
                </div>
                <p>Masuk untuk mengelola stok dan aktivitas gudang.</p>
            </header>

            <form id="admin-login-form">
                <div class="form-group">
                    <label for="login-username">Username Admin</label>
                    <input type="text" id="login-username" name="username"
                           placeholder="Masukkan username" autocomplete="username"
                           required autofocus>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password"
                           placeholder="Masukkan password" autocomplete="current-password"
                           required>
                </div>
                <div id="login-error-msg" class="auth-error-alert hidden" role="alert">
                    Username atau password salah. Silakan coba lagi.
                </div>
                <button type="submit" class="btn btn-login-submit">Masuk ke Dashboard</button>
            </form>

            <footer class="login-footer">
                <small>© 2026 Wallpaper Malang id. All Rights Reserved.</small>
            </footer>
        </section>
    </main>

    <script>
        const loginForm = document.getElementById("admin-login-form");
        const errorMessage = document.getElementById("login-error-msg");

        loginForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const username = document.getElementById("login-username").value.trim();
            const password = document.getElementById("login-password").value;

            if (username === "admin" && password === "malang123") {
                sessionStorage.setItem("wallpaperAdminAuthenticated", "true");
                window.location.href = "index.html";
                return;
            }

            errorMessage.classList.remove("hidden");
            document.getElementById("login-password").focus();
        });
    </script>
</body>
</html>
