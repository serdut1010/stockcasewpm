<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4c1d95">
    <title>Login Admin - Wallpaper Malang id</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #4c1d95 0%, #1e1b4b 100%);
        }

        .login-frame {
            display: flex;
        }

        .login-card {
            max-width: 440px;
            padding: 40px;
        }

        .login-mark {
            color: #8b5cf6;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .brand-logo h1 {
            color: #4c1d95;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: lowercase;
        }

        .form-group input {
            min-height: 46px;
        }

        .form-group input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        .btn-login-submit:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .login-footer small {
            font-size: 0.75rem;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>
<body>
    <main class="login-frame active">
        <section class="login-card shadow-lg" aria-labelledby="login-title">
            <header class="login-header">
                <p class="login-mark">Admin inventory portal</p>
                <div class="brand-logo">
                    <h1 id="login-title">wallpaper malang</h1>
                    <span class="brand-badge" aria-label="Indonesia">id</span>
                </div>
                <p>Masuk untuk mengelola stok dan aktivitas gudang.</p>
            </header>

            <form id="admin-login-form">
                <div class="form-group">
                    <label for="login-email">Email Admin</label>
                    <input type="email" id="login-email" name="email"
                           placeholder="Masukkan email admin" autocomplete="username"
                           required autofocus>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password"
                           placeholder="Masukkan password" autocomplete="current-password"
                           required>
                </div>
                <div id="login-error-msg" class="auth-error-alert hidden" role="alert"></div>
                <button type="submit" class="btn btn-login-submit">Masuk ke Dashboard</button>
            </form>

            <footer class="login-footer">
                <small>© 2026 Wallpaper Malang id. All Rights Reserved.</small>
            </footer>
        </section>
    </main>

    <!-- Library Supabase (versi dikunci) lalu konfigurasi koneksi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        const loginForm = document.getElementById("admin-login-form");
        const errorMessage = document.getElementById("login-error-msg");
        const submitBtn = loginForm.querySelector('button[type="submit"]');

        function showError(text) {
            errorMessage.textContent = text;
            errorMessage.classList.remove("hidden");
        }

        // Pastikan library dan konfigurasi siap sebelum login dipakai
        const siap = typeof db !== "undefined";
        if (!siap) {
            showError("Library Supabase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.");
            submitBtn.disabled = true;
        } else if (SUPABASE_URL.includes("GANTI-DENGAN")) {
            showError("Supabase belum dikonfigurasi. Isi URL dan anon key di js/supabase-config.js.");
            submitBtn.disabled = true;
        } else {
            // Jika sesi login masih aktif, langsung ke dashboard
            db.auth.getSession().then(({ data: { session } }) => {
                if (session) window.location.replace("index.html");
            });
        }

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!siap) return;

            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;

            errorMessage.classList.add("hidden");
            submitBtn.disabled = true;

            const { error } = await db.auth.signInWithPassword({ email, password });

            if (error) {
                submitBtn.disabled = false;
                if (error.message.includes("Invalid login credentials")) {
                    showError("Email atau password salah. Silakan coba lagi.");
                } else {
                    showError("Login gagal: " + error.message);
                }
                document.getElementById("login-password").focus();
                return;
            }

            window.location.href = "index.html";
        });
    </script>
</body>
</html>
